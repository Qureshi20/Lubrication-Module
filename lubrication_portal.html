<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uptime Guard - Lubrication Tasks</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        app: {
                            sidebar: '#152136',
                            main: '#0a101f',
                            card: '#16233a',
                            cardHover: '#1c2b47',
                            border: '#2a3a56',
                            text: '#94a3b8',
                            textLight: '#e2e8f0',
                            primary: '#3b82f6',
                            overdue: '#ef4444',
                            critical: '#f97316',
                            pending: '#64748b',
                            uptodate: '#10b981'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #0a101f;
            color: #e2e8f0;
            overflow: hidden; /* Prevent body scroll, handle in main content */
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0a101f; 
        }
        ::-webkit-scrollbar-thumb {
            background: #2a3a56; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569; 
        }

        .card-img-placeholder {
            background: linear-gradient(135deg, #2a3a56, #16233a);
        }
    </style>
</head>
<body class="font-sans flex h-screen w-full">

    <aside class="w-64 bg-app-sidebar border-r border-app-border flex-shrink-0 flex flex-col hidden md:flex z-10 shadow-2xl relative">
        <div class="p-6 flex items-center gap-3 border-b border-app-border/50">
            <div class="text-app-primary text-xl">
                <i class="fa-solid fa-shield-heart"></i>
            </div>
            <h1 class="text-lg font-bold text-white tracking-wide">Uptime Guard</h1>
        </div>
        
        <nav class="flex-grow p-4 space-y-1">
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-app-card border border-app-border/50 text-white font-medium">
                <i class="fa-solid fa-clipboard-list w-5 text-center text-app-primary"></i> Tasks
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg text-app-text hover:bg-app-card hover:text-white transition-colors">
                <i class="fa-regular fa-bell w-5 text-center"></i> Alerts
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg text-app-text hover:bg-app-card hover:text-white transition-colors">
                <i class="fa-solid fa-gears w-5 text-center"></i> Machines
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg text-app-text hover:bg-app-card hover:text-white transition-colors">
                <i class="fa-solid fa-chart-simple w-5 text-center"></i> Analytics
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg text-app-text hover:bg-app-card hover:text-white transition-colors">
                <i class="fa-solid fa-clock-rotate-left w-5 text-center"></i> Activity Log
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg text-app-text hover:bg-app-card hover:text-white transition-colors">
                <i class="fa-regular fa-file-lines w-5 text-center"></i> Reports
            </a>
        </nav>
    </aside>

    <main class="flex-grow flex flex-col h-full min-w-0 bg-app-main relative">
        <!-- Header -->
        <header class="p-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 z-10 sticky top-0 bg-app-main/95 backdrop-blur border-b border-app-border/30">
            <div class="flex items-center gap-4">
                <button class="md:hidden text-app-text hover:text-white">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
                <h2 class="text-2xl font-bold text-white tracking-tight">Lubrication Tasks</h2>
            </div>
            
            <div class="flex items-center gap-3">
                <select id="machineSelect" class="bg-app-sidebar border border-app-border text-app-textLight text-sm rounded-lg focus:ring-app-primary focus:border-app-primary block w-full p-2.5 outline-none appearance-none pr-8 relative cursor-pointer hover:border-slate-500 transition-colors">
                    <option value="B Flute (BF)">B Flute (BF)</option>
                    <option value="BHS Corrugator">BHS Corrugator</option>
                    <option value="Topra 924">Topra 924</option>
                    <option value="HH Corrugator">HH Corrugator</option>
                </select>
                <!-- Custom chevron for select -->
                <div class="pointer-events-none absolute right-9 text-app-text">
                    <i class="fa-solid fa-chevron-down text-xs"></i>
                </div>
            </div>
        </header>

        <!-- Tasks Container -->
        <div class="flex-grow overflow-y-auto p-6" id="tasksContainer">
            <!-- Loading State -->
            <div id="loadingIndicator" class="flex flex-col items-center justify-center h-64 text-app-text">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-4 text-app-primary"></i>
                <p>Loading tasks from Uptime Guard...</p>
            </div>
            
            <!-- Dynamic Content Renders Here -->
            <div id="taskListContent" class="pb-12 hidden"></div>
        </div>
        
        <!-- Action Modal Overlay (Hidden by default) -->
        <div id="actionModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
            <div class="bg-app-sidebar border border-app-border rounded-xl shadow-2xl p-6 max-w-sm w-full mx-4 transform scale-95 transition-transform duration-300" id="actionModalContent">
                <h3 class="text-lg font-bold text-white mb-2">Confirm Lubrication</h3>
                <p class="text-app-text text-sm mb-6" id="modalDesc">Are you sure you want to mark these points as lubricated?</p>
                <div class="flex gap-3 justify-end">
                    <button id="btnCancel" class="px-4 py-2 rounded-lg text-sm font-medium text-app-textLight bg-app-card border border-app-border hover:bg-app-border transition-colors">Cancel</button>
                    <button id="btnConfirm" class="px-4 py-2 rounded-lg text-sm font-medium text-white bg-app-primary hover:bg-blue-600 transition-colors">Confirm Completion</button>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, setDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Environment globals
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'rpl-lube-app-v1';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            // Fallback mock config to prevent errors if running outside environment
            apiKey: "mock-key", projectId: "mock-project"
        };
        const authToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let app, db, auth, currentUserId;
        let unsubscribeTasks = null;
        let allTasks = [];
        
        // State for modal
        let pendingUpdateTaskId = null;
        let pendingUpdatePoints = 0;
        let pendingUpdateFrequency = '';

        // Initial Seed Data (Matches the reference image)
        const seedTasks = [
            {
                id: "task_1",
                machine: "B Flute (BF)",
                module: "HPA-A",
                title: "Re-Lubrication of Bearings of Guide Rolls",
                points: 2,
                lubePoints: 20,
                frequency: "2 Weeks",
                lubricant: "(Gadus) S2 V 220",
                lastDone: "10 Sept 2026",
                nextDue: "24 Sept 2026",
                order: 1
            },
            {
                id: "task_2",
                machine: "B Flute (BF)",
                module: "HPA-A",
                title: "Re-Lubrication of preheater shaft on both sides",
                points: 2,
                lubePoints: 6,
                frequency: "2 Weeks",
                lubricant: "(Gadus) S2 V 220",
                lastDone: "10 Sept 2026",
                nextDue: "24 Sept 2026",
                order: 2
            },
            {
                id: "task_3",
                machine: "B Flute (BF)",
                module: "HPA-A",
                title: "Re-Lubrication of Bearings of Wrap Rolls",
                points: 2,
                lubePoints: 12,
                frequency: "2 Weeks",
                lubricant: "(Gadus) S2 V 220",
                lastDone: "12 Sept 2026",
                nextDue: "26 Sept 2026",
                order: 3
            },
            {
                id: "task_4",
                machine: "B Flute (BF)",
                module: "QF-P (CF)",
                title: "Re-lubricate pressure roll bearing on both sides of machine using grease gun",
                points: 1,
                lubePoints: 6,
                frequency: "2 Weeks",
                lubricant: "(Gleitmo 591)",
                lastDone: "07 Sept 2026",
                nextDue: "21 Sept 2026",
                order: 4
            },
            {
                id: "task_5",
                machine: "B Flute (BF)",
                module: "QF-P (CF)",
                title: "Re-lubricate the take off belts bearings on both sides of machine",
                points: 1,
                lubePoints: 8,
                frequency: "Weekly",
                lubricant: "(Gadus) S2 V 220",
                lastDone: "03 Sept 2026",
                nextDue: "10 Sept 2026",
                order: 5
            },
            {
                id: "task_6",
                machine: "B Flute (BF)",
                module: "QF-P (CF)",
                title: "Re-lubricate eccentric adjustment of the levers on the corrugating roll module on both sides of machine using grease gun",
                points: 1,
                lubePoints: 1,
                frequency: "Monthly",
                lubricant: "(Gadus) S2 V 220",
                lastDone: "—",
                nextDue: "—",
                order: 6
            }
        ];

        // Utility: Date formatting and parsing
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sept", "Oct", "Nov", "Dec"];
        
        function formatDate(date) {
            const day = String(date.getDate()).padStart(2, '0');
            const month = monthNames[date.getMonth()];
            const year = date.getFullYear();
            return `${day} ${month} ${year}`;
        }

        function calculateNextDue(fromDateStr, frequency) {
            let baseDate = new Date(); // Default to today if unparseable
            
            // Try to parse existing date (format: DD Mmm YYYY)
            if (fromDateStr && fromDateStr !== '—') {
                const parts = fromDateStr.split(' ');
                if (parts.length === 3) {
                    const monthIdx = monthNames.findIndex(m => m.toLowerCase() === parts[1].toLowerCase() || parts[1].toLowerCase().startsWith(m.toLowerCase().substring(0,3)));
                    if (monthIdx !== -1) {
                        baseDate = new Date(parseInt(parts[2]), monthIdx, parseInt(parts[0]));
                    }
                }
            }

            const nextDate = new Date(baseDate.getTime());
            
            switch(frequency.toLowerCase()) {
                case 'weekly':
                case '1 week':
                    nextDate.setDate(nextDate.getDate() + 7);
                    break;
                case '2 weeks':
                    nextDate.setDate(nextDate.getDate() + 14);
                    break;
                case 'monthly':
                case '1 month':
                    nextDate.setMonth(nextDate.getMonth() + 1);
                    break;
                case '3 months':
                    nextDate.setMonth(nextDate.getMonth() + 3);
                    break;
                case '6 months':
                    nextDate.setMonth(nextDate.getMonth() + 6);
                    break;
                case 'yearly':
                    nextDate.setFullYear(nextDate.getFullYear() + 1);
                    break;
                default:
                    nextDate.setDate(nextDate.getDate() + 14); // Fallback
            }
            return formatDate(nextDate);
        }

        // Determine Status based on current date vs nextDue date
        function getStatus(lastDone, nextDueStr) {
            if (lastDone === '—' || !lastDone || !nextDueStr || nextDueStr === '—') return { text: 'Never checked', class: 'text-app-pending bg-slate-800 border-slate-700' };
            
            const now = new Date();
            // Strip time for clean day-level comparison
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            
            const parts = nextDueStr.split(' ');
            if (parts.length !== 3) return { text: 'Pending', class: 'text-app-pending bg-slate-800 border-slate-700' };
            
            const monthIdx = monthNames.findIndex(m => m.toLowerCase() === parts[1].toLowerCase() || parts[1].toLowerCase().startsWith(m.toLowerCase().substring(0,3)));
            if (monthIdx === -1) return { text: 'Pending', class: 'text-app-pending bg-slate-800 border-slate-700' };
            
            const dueDate = new Date(parseInt(parts[2]), monthIdx, parseInt(parts[0]));
            
            const diffTime = dueDate.getTime() - today.getTime();
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays < 0) {
                // If severely overdue (e.g. > 14 days)
                if (diffDays < -14) return { text: 'Critical', class: 'text-app-critical bg-orange-900/30 border-orange-800/50' };
                return { text: 'Overdue', class: 'text-app-overdue bg-red-900/30 border-red-800/50' };
            } else if (diffDays === 0) {
                return { text: 'Due Today', class: 'text-app-critical bg-orange-900/30 border-orange-800/50' };
            } else if (diffDays <= 3) {
                return { text: 'Pending', class: 'text-app-pending bg-slate-800 border-slate-700' };
            } else {
                return { text: 'Up to Date', class: 'text-app-uptodate bg-green-900/20 border-green-800/50' };
            }
        }

        async function initApp() {
            try {
                if(firebaseConfig.apiKey === "mock-key") {
                    console.warn("Using mock Firebase configuration. Proceeding with dummy data rendering if possible.");
                    // We will just render mock data if no real Firebase
                } else {
                    app = initializeApp(firebaseConfig);
                    db = getFirestore(app);
                    auth = getAuth(app);
                    
                    // Auth flow (Rule 3)
                    if (authToken) {
                        await signInWithCustomToken(auth, authToken);
                    } else {
                        await signInAnonymously(auth);
                    }
                    currentUserId = auth.currentUser.uid;
                    
                    await checkAndSeedData();
                    startDataListener();
                }
            } catch (error) {
                console.error("Initialization error:", error);
                document.getElementById('loadingIndicator').innerHTML = `
                    <div class="text-app-overdue flex flex-col items-center">
                        <i class="fa-solid fa-triangle-exclamation text-3xl mb-4"></i>
                        <p>Error connecting to database.</p>
                        <p class="text-xs mt-2 text-app-text">${error.message}</p>
                    </div>
                `;
            }
        }

        async function checkAndSeedData() {
            // Rule 1: Public paths for shared tasks
            const tasksRef = collection(db, 'artifacts', appId, 'public', 'data', 'lube_tasks');
            const snap = await getDocs(tasksRef);
            
            if (snap.empty) {
                console.log("No tasks found. Seeding initial database...");
                // Write seed tasks
                for (const task of seedTasks) {
                    const docRef = doc(tasksRef, task.id);
                    await setDoc(docRef, task);
                }
            }
        }

        function startDataListener() {
            const tasksRef = collection(db, 'artifacts', appId, 'public', 'data', 'lube_tasks');
            
            // Rule 2: Fetch all, filter in JS
            unsubscribeTasks = onSnapshot(tasksRef, (snapshot) => {
                allTasks = [];
                snapshot.forEach(doc => {
                    allTasks.push({ docId: doc.id, ...doc.data() });
                });
                
                // Sort by order
                allTasks.sort((a, b) => (a.order || 99) - (b.order || 99));
                renderTasks();
            }, (error) => {
                console.error("Error listening to tasks:", error);
            });
        }

        function renderTasks() {
            const container = document.getElementById('taskListContent');
            const selectedMachine = document.getElementById('machineSelect').value;
            
            document.getElementById('loadingIndicator').classList.add('hidden');
            container.classList.remove('hidden');
            
            container.innerHTML = '';
            
            // Filter by machine
            const filteredTasks = allTasks.filter(t => t.machine === selectedMachine);
            
            if (filteredTasks.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-app-text">
                        <i class="fa-regular fa-folder-open text-4xl mb-3 opacity-50"></i>
                        <p>No lubrication tasks found for this section.</p>
                    </div>
                `;
                return;
            }

            // Group by module
            const grouped = {};
            filteredTasks.forEach(task => {
                if (!grouped[task.module]) grouped[task.module] = [];
                grouped[task.module].push(task);
            });

            // Generate HTML
            for (const [moduleName, tasks] of Object.entries(grouped)) {
                
                const sectionHtml = document.createElement('div');
                sectionHtml.className = 'mb-10';
                
                // Section Header
                const header = document.createElement('h3');
                header.className = 'text-lg font-semibold text-app-textLight mb-4 tracking-wide';
                header.textContent = moduleName;
                sectionHtml.appendChild(header);
                
                // Grid Container
                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-5';
                
                tasks.forEach(task => {
                    const status = getStatus(task.lastDone, task.nextDue);
                    const isUpToDate = status.text === 'Up to Date';
                    
                    const card = document.createElement('div');
                    card.className = `bg-app-card rounded-xl border ${isUpToDate ? 'border-app-border/50' : 'border-app-border'} overflow-hidden shadow-lg transition-colors hover:border-slate-600 flex flex-col`;
                    
                    card.innerHTML = `
                        <div class="p-5 flex-grow">
                            <!-- Header Row -->
                            <div class="flex items-start justify-between mb-4 gap-3">
                                <div class="flex items-start gap-4">
                                    <div class="w-16 h-16 rounded overflow-hidden flex-shrink-0 card-img-placeholder flex items-center justify-center relative group cursor-pointer border border-app-border/50">
                                        <i class="fa-solid fa-image text-app-text opacity-30 text-xl"></i>
                                        <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                            <i class="fa-solid fa-magnifying-glass text-white"></i>
                                        </div>
                                    </div>
                                    <div>
                                        <div class="text-sm font-bold text-white mb-1">${task.module}</div>
                                        <p class="text-xs text-app-textLight leading-snug line-clamp-2" title="${task.title}">${task.title}</p>
                                    </div>
                                </div>
                                <div class="flex-shrink-0">
                                    <span class="inline-flex items-center px-2.5 py-0.5 rounded text-[10px] font-medium border ${status.class}">
                                        ${status.text}
                                    </span>
                                </div>
                            </div>
                            
                            <!-- Stats Grid -->
                            <div class="grid grid-cols-2 gap-y-3 gap-x-2 text-xs">
                                <div>
                                    <span class="text-app-text block mb-0.5">Points:</span>
                                    <span class="text-app-textLight">${task.points}</span>
                                </div>
                                <div>
                                    <span class="text-app-text block mb-0.5">Lube points:</span>
                                    <span class="text-app-textLight">${task.lubePoints}</span>
                                </div>
                                <div>
                                    <span class="text-app-text block mb-0.5">Frequency:</span>
                                    <span class="text-app-textLight">${task.frequency}</span>
                                </div>
                                <div class="truncate" title="${task.lubricant}">
                                    <span class="text-app-text block mb-0.5">Lubricant:</span>
                                    <span class="text-app-textLight">${task.lubricant}</span>
                                </div>
                                <div>
                                    <span class="text-app-text block mb-0.5">Last done:</span>
                                    <span class="text-app-textLight">${task.lastDone}</span>
                                </div>
                                <div>
                                    <span class="text-app-text block mb-0.5">Next due:</span>
                                    <span class="text-app-textLight font-medium ${!isUpToDate && task.nextDue !== '—' ? 'text-white' : ''}">${task.nextDue}</span>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Action Button -->
                        <div class="p-4 pt-0 mt-auto">
                            <button onclick="window.confirmTaskCompletion('${task.docId}', ${task.lubePoints}, '${task.frequency}')" 
                                class="w-full flex items-center justify-center gap-2 py-2.5 px-4 rounded-lg text-sm font-medium transition-colors border
                                ${isUpToDate 
                                    ? 'bg-app-main border-app-border text-app-text hover:text-white hover:border-slate-500' 
                                    : 'bg-[#1e2f4c] border-[#2c4470] text-[#8ba5d8] hover:bg-[#25395c] hover:text-white'}">
                                <i class="fa-regular ${isUpToDate ? 'fa-square-check text-green-500' : 'fa-square-check'}"></i> 
                                ${isUpToDate ? 'Completed' : `Check off (${task.lubePoints} lubrication point${task.lubePoints !== 1 ? 's' : ''})`}
                            </button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
                
                sectionHtml.appendChild(grid);
                container.appendChild(sectionHtml);
            }
        }

        // Expose function to window for inline onclick handler
        window.confirmTaskCompletion = function(docId, points, frequency) {
            pendingUpdateTaskId = docId;
            pendingUpdatePoints = points;
            pendingUpdateFrequency = frequency;
            
            const modal = document.getElementById('actionModal');
            const modalContent = document.getElementById('actionModalContent');
            
            document.getElementById('modalDesc').innerHTML = `You are about to mark <strong>${points} lubrication point${points !== 1 ? 's' : ''}</strong> as complete.<br>This will update the last done date to today.`;
            
            modal.classList.remove('hidden');
            // Slight delay to allow display block to apply before changing opacity for transition
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
            }, 10);
        };

        function closeModal() {
            const modal = document.getElementById('actionModal');
            const modalContent = document.getElementById('actionModalContent');
            
            modal.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                pendingUpdateTaskId = null;
            }, 300); // match transition duration
        }

        document.getElementById('btnCancel').addEventListener('click', closeModal);
        
        document.getElementById('btnConfirm').addEventListener('click', async () => {
            if (!pendingUpdateTaskId || !db) return;
            
            const btn = document.getElementById('btnConfirm');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Saving...';
            btn.disabled = true;
            
            try {
                const today = new Date();
                const lastDoneStr = formatDate(today);
                const nextDueStr = calculateNextDue(lastDoneStr, pendingUpdateFrequency);
                
                const taskRef = doc(db, 'artifacts', appId, 'public', 'data', 'lube_tasks', pendingUpdateTaskId);
                
                // Update Firebase Document
                await updateDoc(taskRef, {
                    lastDone: lastDoneStr,
                    nextDue: nextDueStr
                });
                
                closeModal();
            } catch (error) {
                console.error("Error updating task:", error);
                alert("Failed to update task. Check console for details.");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        // Event listener for dropdown change
        document.getElementById('machineSelect').addEventListener('change', () => {
            if (allTasks.length > 0) renderTasks();
        });

        // Start initialization
        document.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
</html>
